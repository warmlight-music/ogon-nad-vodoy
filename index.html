<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fire on the Water — Montreux 1973</title>
<style>
  :root{
    --bg:#0a0505; /* Почти черный, с оттенком */
    --bg2:#1a0a08; /* Темно-бордовый */
    --card:#26120f; /* Тлеющий уголь */
    --accent:#e63946; /* Огненно-красный */
    --accent2:#b02a37;
    --text:#f1faee; /* Белый с теплым оттенком */
    --muted:#a89b9b;
    --glow:rgba(230,57,70,.4);
  }
  
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  *{box-sizing:border-box;margin:0;padding:0}
  
  body{
    font-family: 'Impact', 'Arial Black', sans-serif; /* Брутальный шрифт */
    background: radial-gradient(circle at 50% 0%,var(--bg2) 0%,var(--bg) 70%);
    color:var(--text); min-height:100vh; display:flex; flex-direction:column;
    align-items:center; padding:24px 16px 48px; gap:24px;
    width: 100%; max-width: 100vw; overflow-x: hidden;
    -webkit-user-select: none; user-select: none; line-height: 1.5;
  }

  .album { text-align:center; display:flex; flex-direction:column; align-items:center; gap:16px; width:100%; max-width:600px; margin-top: 20px;}
  .album__cover { width:min(280px,72vw); aspect-ratio:1/1; border-radius:4px; object-fit:cover; box-shadow:0 20px 50px var(--glow); border:2px solid var(--accent); pointer-events: none; }
  .album__title { font-size:clamp(26px,6vw,44px); font-weight:900; letter-spacing:.02em; color: #fff; text-transform: uppercase; line-height: 1.1; text-shadow: 0 0 20px var(--glow); }
  .album__sub { color:var(--accent); font-size:14px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; font-family: system-ui, sans-serif; }

  .album__announce {
    max-width: 540px;
    font-family: 'Georgia', serif;
    font-size: 14px;
    color: var(--muted);
    font-style: italic;
    line-height: 1.6;
    margin: 10px 0;
    padding: 15px 20px;
    border-top: 1px solid rgba(230,57,70,.2);
    border-bottom: 1px solid rgba(230,57,70,.2);
    text-align: center;
  }

  .carousel { width:100%; max-width:960px; display:flex; gap:20px; overflow-x:auto; padding:10px 8px 20px; scroll-snap-type:x mandatory; scrollbar-width:thin; scrollbar-color:var(--accent) transparent; }
  .carousel::-webkit-scrollbar { height:6px; }
  .carousel::-webkit-scrollbar-thumb { background:var(--accent); border-radius:2px; }
  
  .track { flex:0 0 auto; width:200px; scroll-snap-align:center; background:var(--card); border-radius:4px; padding:10px; cursor:pointer; transition:transform .2s, box-shadow .2s; border:1px solid rgba(255,255,255,.05); text-align:left; display: flex; flex-direction: column;}
  .track:hover { transform:translateY(-5px); box-shadow: 0 10px 25px var(--glow); border-color: rgba(230,57,70,.4); }
  .track.active { border:2px solid var(--accent); box-shadow:0 0 15px var(--glow); }
  
  .track__cover { width:100%; aspect-ratio:1/1; border-radius:2px; object-fit:cover; display:block; margin-bottom:12px; background:var(--bg2); pointer-events: none; flex-shrink: 0; filter: contrast(1.2) sepia(0.2);}
  
  .track__num { font-size:11px; color:var(--accent); font-weight:800; letter-spacing:.1em; margin-bottom:6px; font-family: system-ui, sans-serif;}
  .track__name { font-size:15px; font-weight:800; margin-bottom:4px; line-height: 1.2; color: #fff; text-transform: uppercase; }
  .track__desc { font-size:12px; color:var(--muted); line-height: 1.4; flex-grow: 1; font-family: 'Georgia', serif; font-style: italic; }

  .player { width:100%; max-width:600px; background:var(--card); border-radius:8px; padding:20px; display:flex; flex-direction:column; gap:16px; box-shadow:0 15px 50px rgba(0,0,0,.8); border:1px solid rgba(230,57,70,.2); position: sticky; bottom: 10px; z-index: 10;}
  .player__now { display:flex; align-items:center; gap:16px; }
  .player__cover { width:70px; height:70px; border-radius:4px; object-fit:cover; background:var(--bg2); border:1px solid var(--accent); pointer-events: none; }
  .player__info { overflow:hidden; flex:1; }
  .player__title { font-weight:800; font-size:16px; line-height:1.25; margin-bottom:2px; color: #fff; text-transform: uppercase;}
  .player__artist { color:var(--muted); font-size:13px; font-family: 'Georgia', serif; font-style: italic;}
  .player audio { width:100%; outline: none; }
  
  .player__nav { display:flex; justify-content:center; gap:16px; }
  .player__nav button { background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; color:#fff; padding:12px 24px; border-radius:4px; font-weight:800; font-size:14px; cursor:pointer; transition:filter 0.3s; text-transform: uppercase; letter-spacing: 1px; font-family: system-ui, sans-serif;}
  .player__nav button:hover { filter:brightness(1.2); }
</style>
</head>
<body>
<!-- Кнопка возврата на главную -->
<a href="https://warmlight-music.github.io/my-music/" class="back-to-main">
    ← Вернуться  
</a>

<style>
    .back-to-main {
        position: fixed;
        top: 20px; /* Опустили кнопку вниз, чтобы не мешать переключателю языка */
        left: 20px;
        background-color: #1a1512; /* Темный фон, как на скриншоте */
        color: #d4af37;
        padding: 10px 20px;
        border-radius: 30px;
        text-decoration: none;
        font-family: 'Georgia', serif;
        font-size: 14px;
        border: 1px solid #4a3b2f;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        transition: all 0.3s ease;
        z-index: 9999;
    }

    .back-to-main:hover {
        background-color: #d4af37;
        color: #1a1512;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
    }
    
    /* Для мобильных телефонов можно сделать ее чуть меньше */
    @media (max-width: 768px) {
        .back-to-main {
            top: 20px; /* На телефоне шапка может быть чуть меньше */
            left: 10px;
            padding: 8px 15px;
            font-size: 12px;
        }
    }
</style>
  <section class="album">
    <img class="album__cover" id="albumCover" src="cover.jpg" alt="Album Cover">
    <h1 class="album__title">Fire on the Water</h1>
    <p class="album__sub">Montreux 1973</p>
    
    <p class="album__announce">
      Семь оригинальных хард-рок композиций, воссоздающих сырую аналоговую мощь золотой эры британского рока. Неистовая дуэль Hammond и Stratocaster, ураганные барабаны и семь огненных ночей на берегу Женевского озера.
    </p>
  </section>

  <div class="carousel" id="carousel"></div>

  <div class="player">
    <div class="player__now">
      <img class="player__cover" id="playerCover" src="cover.jpg" alt="Cover">
      <div class="player__info">
        <div class="player__title" id="playerTitle">Выбери трек</div>
        <div class="player__artist" id="playerArtist">Montreux 1973</div>
      </div>
    </div>
    <audio id="audio" controls controlslist="nodownload" preload="none"></audio>
    <div class="player__nav">
      <button id="prevBtn">⏮ Пред</button>
      <button id="nextBtn">След ⏭</button>
    </div>
  </div>

<script>
  const album = {
    title: "Fire on the Water",
    cover: "cover.jpg",
    tracks: [
      { id: 1, name: "Iron Wheels", desc: "в духе Highway Star" },
      { id: 2, name: "Fire on the Water", desc: "в духе Smoke on the Water" },
      { id: 3, name: "Child of the Storm", desc: "в духе Child in Time" },
      { id: 4, name: "Black Velvet Woman", desc: "в духе Black Night" },
      { id: 5, name: "Castle of Mirrors", desc: "в духе Burn" },
      { id: 6, name: "Midnight Train to Nowhere", desc: "в духе Mistreated" },
      { id: 7, name: "Thunder Across the Lake", desc: "финальный эпик" }
    ]
  };

  let currentTrack = -1;

  const carousel    = document.getElementById('carousel');
  const audio       = document.getElementById('audio');
  const playerCover = document.getElementById('playerCover');
  const playerTitle = document.getElementById('playerTitle');
  const playerArtist= document.getElementById('playerArtist');

  const pad = (n) => String(n).padStart(2,'0');
  
  const coverPath = (id) => `covers/${pad(id)}.jpg`;
  const songPath  = (id) => `en${pad(id)}.mp3`;

  function renderCarousel(){
    carousel.innerHTML = '';
    album.tracks.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'track' + (i === currentTrack ? ' active' : '');
      el.dataset.index = i;
      el.innerHTML = `
        <img class="track__cover" src="${coverPath(t.id)}" alt="${t.name}">
        <div class="track__num">TRACK #${t.id}</div>
        <div class="track__name">${t.name}</div>
        <div class="track__desc">${t.desc}</div>
      `;
      el.addEventListener('click', () => play(i));
      carousel.appendChild(el);
    });
  }

  function play(i){
    if (i < 0) i = album.tracks.length - 1;
    if (i >= album.tracks.length) i = 0;

    currentTrack = i;
    const t = album.tracks[i];

    playerCover.src = coverPath(t.id);
    playerTitle.textContent = t.name;
    playerArtist.textContent = t.desc;

    [...carousel.querySelectorAll('.track')].forEach((el, idx) => el.classList.toggle('active', idx === i));
    carousel.children[i]?.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});

    audio.src = songPath(t.id);
    audio.play().catch(()=>{});
  }

  document.getElementById('prevBtn').onclick = () => play(currentTrack - 1);
  document.getElementById('nextBtn').onclick = () => play(currentTrack + 1);
  audio.addEventListener('ended', () => play(currentTrack + 1));

  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault());

  renderCarousel();
</script>
</body>
</html>
